<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1"/>
<title>BasketPro AI v4</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--sf:#161b22;--sf2:#1c2333;--sf3:#21293a;
  --br:#30363d;--br2:#3d4555;
  --teal:#2dd4bf;--teal2:#14b8a6;--teal-bg:rgba(45,212,191,.07);--teal-br:rgba(45,212,191,.25);--teal-glow:0 0 20px rgba(45,212,191,.15);
  --gold:#fbbf24;--gold-bg:rgba(251,191,36,.06);--gold-br:rgba(251,191,36,.2);
  --green:#34d399;--green-bg:rgba(52,211,153,.07);--green-br:rgba(52,211,153,.2);
  --red:#fb7185;--red-bg:rgba(251,113,133,.06);--red-br:rgba(251,113,133,.18);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,.06);--blue-br:rgba(96,165,250,.18);
  --violet:#a78bfa;--violet-bg:rgba(167,139,250,.05);--violet-br:rgba(167,139,250,.12);
  --w:#f0f6fc;--w2:#c9d1d9;--w3:#8b949e;--w4:#6e7681;--w5:#484f58;
  --r:14px;--rs:10px;--mx:720px;
  --f:'DM Sans',system-ui,sans-serif;--fm:'Space Mono',monospace
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--w);font-family:var(--f);min-height:100dvh;-webkit-font-smoothing:antialiased;font-size:15px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 800px 500px at 50% -10%,rgba(45,212,191,.04),transparent);pointer-events:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--br);border-radius:4px}
.W{max-width:var(--mx);margin:0 auto;position:relative;z-index:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}

header{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--br);padding:0 20px}
.hdr{max-width:var(--mx);margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--teal),var(--teal2));border-radius:10px;display:grid;place-items:center;font-size:1rem;box-shadow:var(--teal-glow)}
.logo-txt{font-size:1.2rem;font-weight:900;letter-spacing:-.03em}.logo-txt b{color:var(--teal)}
.logo-v{font-size:.55rem;font-weight:700;color:var(--teal);background:var(--teal-bg);border:1px solid var(--teal-br);padding:2px 8px;border-radius:12px;margin-left:4px}
.pills{display:flex;gap:3px;background:var(--sf);border:1px solid var(--br);padding:3px;border-radius:12px}
.pill{padding:7px 14px;border:none;background:0;color:var(--w3);font-size:.8rem;font-weight:700;cursor:pointer;border-radius:9px;transition:.2s;font-family:var(--f)}
.pill:hover{color:var(--w2);background:var(--sf2)}.pill.on{background:var(--teal);color:#000}
.sts{font-size:.65rem;color:var(--w3);font-family:var(--fm);display:flex;align-items:center;gap:5px}
.sdot{width:6px;height:6px;border-radius:50%}.sdot.ok{background:var(--green)}.sdot.ld{background:var(--gold);animation:pulse .5s infinite}.sdot.er{background:var(--red)}

.scr{display:none;padding:16px 20px 100px}.scr.on{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.topbar h2{font-size:.85rem;font-weight:800;color:var(--w3);text-transform:uppercase;letter-spacing:1px}
.topbar .cnt{font-size:.75rem;color:var(--w4);font-family:var(--fm)}
.back{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;background:var(--sf);border:1px solid var(--br);border-radius:var(--rs);color:var(--w2);font-size:.85rem;font-weight:700;cursor:pointer;font-family:var(--f);transition:.15s}
.back:hover{border-color:var(--teal);color:var(--teal)}.back svg{width:14px;height:14px}

.country{margin-bottom:20px;animation:fadeUp .4s ease both}
.country-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.country-flag{font-size:1.1rem}.country-name{font-size:.8rem;font-weight:800;color:var(--w3);text-transform:uppercase;letter-spacing:.8px}
.country-line{flex:1;height:1px;background:var(--br);margin-left:8px}
.lg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:560px){.lg-grid{grid-template-columns:1fr 1fr 1fr}}
.lg-card{padding:16px;background:var(--sf);border:1px solid var(--br);border-radius:var(--r);cursor:pointer;transition:all .2s}
.lg-card:hover{border-color:var(--teal-br);box-shadow:var(--teal-glow);transform:translateY(-2px)}.lg-card:active{transform:scale(.97)}
.lg-name{font-size:.95rem;font-weight:800;line-height:1.3;margin-bottom:8px}
.lg-count{display:inline-block;font-size:.7rem;font-weight:700;color:var(--teal);background:var(--teal-bg);border:1px solid var(--teal-br);padding:3px 10px;border-radius:8px;font-family:var(--fm)}

.m-title{font-size:1.2rem;font-weight:900;margin-bottom:14px}
.m-grid{display:grid;gap:8px}
@media(min-width:560px){.m-grid{grid-template-columns:1fr 1fr}}
.mc{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:16px;cursor:pointer;transition:.15s}
.mc:hover{border-color:var(--br2);box-shadow:0 4px 20px rgba(0,0,0,.2)}.mc:active{transform:scale(.98)}
.mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mc-meta{font-size:.75rem;color:var(--w3)}
.mc-badge{font-size:.6rem;font-weight:800;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px}
.mc-badge.live{background:var(--red);color:#fff;animation:pulse .7s infinite}.mc-badge.ft{background:var(--sf2);color:var(--w3)}.mc-badge.ns{background:var(--sf2);color:var(--w3)}
.mc-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.mc-team{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:700;min-width:0}
.mc-team img{width:24px;height:24px;object-fit:contain;border-radius:4px;flex-shrink:0}
.mc-team span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-score{font-size:1.2rem;font-weight:900;font-family:var(--fm);min-width:32px;text-align:right;color:var(--w4)}.mc-score.w{color:var(--teal)}

.a-hero{text-align:center;padding:24px 0 20px;border-bottom:1px solid var(--br);margin-bottom:20px}
.a-league{font-size:.8rem;color:var(--w3);margin-bottom:16px}
.a-vs{display:flex;align-items:center;justify-content:center;gap:20px}
.a-tm{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:90px}
.a-tm img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}
.a-tm .nm{font-size:.9rem;font-weight:800;text-align:center;line-height:1.2}
.a-sc{display:flex;align-items:center;gap:5px}
.a-sn{width:44px;height:52px;background:var(--sf2);border:2px solid var(--br2);border-radius:12px;display:grid;place-items:center;font-size:1.4rem;font-weight:900;font-family:var(--fm)}
.a-sn.w{border-color:var(--teal-br);color:var(--teal);background:var(--teal-bg)}
.a-vl{font-size:.6rem;font-weight:800;color:var(--w4)}

.vfy{padding:12px 16px;border-radius:var(--rs);text-align:center;font-weight:800;font-size:.9rem;margin-bottom:16px;border:1.5px solid}
.vfy.ok{background:var(--green-bg);border-color:var(--green-br);color:var(--green)}
.vfy.ko{background:var(--red-bg);border-color:var(--red-br);color:var(--red)}
.vfy small{display:block;font-size:.72rem;font-weight:600;margin-top:4px;opacity:.7}

.bets-title{font-size:.82rem;font-weight:800;color:var(--w3);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.bet-cards{display:grid;gap:10px;margin-bottom:20px}
@media(min-width:560px){.bet-cards{grid-template-columns:1fr 1fr}}
.bet-card{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:18px;position:relative;transition:.2s}
.bet-card:hover{border-color:var(--br2)}
.bet-card.best{border-color:var(--teal-br);box-shadow:var(--teal-glow)}
.bc-rec{position:absolute;top:10px;right:12px;font-size:.55rem;font-weight:800;color:var(--teal);background:var(--teal-bg);border:1px solid var(--teal-br);padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.bc-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bc-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem}
.bc-icon.w{background:var(--teal-bg);border:1px solid var(--teal-br)}
.bc-icon.ou{background:var(--green-bg);border:1px solid var(--green-br)}
.bc-icon.mg{background:var(--blue-bg);border:1px solid var(--blue-br)}
.bc-icon.hc{background:var(--violet-bg);border:1px solid var(--violet-br)}
.bc-label{font-size:.75rem;font-weight:700;color:var(--w3)}
.bc-pick{font-size:1.6rem;font-weight:900;line-height:1.2;margin-bottom:2px}
.bc-pct{font-size:1.1rem;font-weight:800;font-family:var(--fm);margin-bottom:8px}
.bc-reason{font-size:.78rem;color:var(--w3);line-height:1.4}
.bc-bk{font-size:.65rem;color:var(--gold);margin-top:4px;font-weight:700}

.pred{margin:20px 0;text-align:center}
.pred-box{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:20px;display:inline-block;min-width:250px}
.pred-lbl{font-size:.75rem;font-weight:700;color:var(--w3);margin-bottom:8px}
.pred-val{font-size:2rem;font-weight:900;font-family:var(--fm)}
.pred-sub{font-size:.78rem;color:var(--w4);margin-top:4px}

/* Value */
.val-card{padding:16px;border-radius:var(--r);margin-bottom:16px;border:1.5px solid}
.val-card.yes{background:var(--green-bg);border-color:var(--green-br)}
.val-tag{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.val-main{font-size:1.2rem;font-weight:900}
.val-sub{font-size:.78rem;color:var(--w3);margin-top:4px}
.val-kelly{font-size:.7rem;color:var(--gold);font-weight:700;margin-top:6px}

/* Consensus */
.cons-panel{padding:18px;background:linear-gradient(135deg,rgba(45,212,191,.06),rgba(251,191,36,.04));border:1.5px solid var(--teal-br);border-radius:var(--r);margin-bottom:16px;text-align:center}
.cons-title{font-size:.65rem;color:var(--w4);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.cons-pick{font-size:1.8rem;font-weight:900;margin:4px 0}
.cons-conf{font-size:.82rem;font-weight:700;margin-bottom:10px}
.cons-meter{height:7px;background:var(--sf2);border-radius:4px;overflow:hidden;margin:8px 0}
.cons-meter-fill{height:100%;border-radius:4px;transition:width .4s}
.cons-sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:10px}
.cons-src{padding:8px 6px;border-radius:8px;background:var(--sf);border:1px solid var(--br);text-align:center}
.cons-src.yes{border-color:var(--green-br)}.cons-src.no{border-color:var(--red-br)}
.cons-src-name{font-size:.58rem;color:var(--w4);font-weight:700;margin-bottom:2px}
.cons-src-pick{font-size:.85rem;font-weight:800}

/* Regression */
.reg-panel{padding:18px;background:linear-gradient(135deg,rgba(167,139,250,.05),rgba(96,165,250,.04));border:1.5px solid var(--violet-br);border-radius:var(--r);margin-bottom:16px}
.reg-score{font-size:2.4rem;font-weight:900;font-family:var(--fm);text-align:center}
.reg-grade{display:inline-block;padding:3px 14px;border-radius:8px;font-size:.78rem;font-weight:800;margin:6px auto;border:1px solid}
.reg-factor{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.reg-factor:last-child{border:none}
.reg-fname{flex:1;font-size:.72rem;color:var(--w3)}
.reg-bar{width:80px;height:6px;background:var(--sf2);border-radius:3px;overflow:hidden}
.reg-bar-fill{height:100%;border-radius:3px}
.reg-fval{font-size:.72rem;font-weight:700;width:32px;text-align:right;font-family:var(--fm)}

/* Odds Lab */
.olab-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(max-width:500px){.olab-grid{grid-template-columns:1fr}}
.olab-bk{background:var(--sf);border:1px solid var(--br);border-radius:var(--rs);padding:10px}
.olab-bk-name{font-size:.65rem;color:var(--w4);font-weight:700;margin-bottom:5px}
.olab-bk-row{display:flex;gap:6px}
.olab-cell{flex:1;text-align:center;padding:5px 3px;border-radius:5px;font-size:.8rem;font-weight:700;font-family:var(--fm)}
.olab-cell.h{background:rgba(45,212,191,.1);color:var(--teal)}
.olab-cell.a{background:rgba(96,165,250,.1);color:var(--blue)}
.olab-cell.sh{border:1px solid var(--green-br)}
.olab-steam{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:.72rem}
.olab-steam.bull{background:var(--green-bg);border:1px solid var(--green-br);color:var(--green)}
.olab-steam.neut{background:rgba(100,116,139,.06);border:1px solid rgba(100,116,139,.15);color:var(--w3)}

/* Sections */
.sec{margin-bottom:8px}.sec-btn{width:100%;padding:14px 16px;background:var(--sf);border:1px solid var(--br);border-radius:var(--rs);color:var(--w2);font-size:.85rem;font-weight:700;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;font-family:var(--f);transition:.15s}
.sec-btn:hover{border-color:var(--br2)}.sec-body{display:none;overflow:hidden}.sec-body.open{display:block}
.sec-inner{padding:16px;background:var(--sf);border:1px solid var(--br);border-top:0;border-radius:0 0 var(--rs) var(--rs)}
.sec-arr{font-size:.7rem;transition:transform .2s;display:inline-block}.sec-arr.open{transform:rotate(180deg)}

/* AI */
.ai{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:18px;margin:16px 0}
.ai-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ai-icon{width:32px;height:32px;background:var(--violet-bg);border:1px solid var(--violet-br);border-radius:10px;display:grid;place-items:center;font-size:.9rem}
.ai-name{font-size:.85rem;font-weight:800}.ai-badge{font-size:.55rem;font-weight:700;color:var(--violet);background:var(--violet-bg);border:1px solid var(--violet-br);padding:2px 8px;border-radius:6px}
.ai-txt{font-size:.85rem;color:var(--w2);line-height:1.6;white-space:pre-wrap}

/* OU grid */
.ou-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.ou-item{padding:10px;text-align:center;background:var(--sf2);border-radius:8px;border:1px solid transparent}
.ou-item.main{border-color:var(--teal-br);background:var(--teal-bg)}
.ou-val{font-size:.85rem;font-weight:800}.ou-lbl{font-size:.65rem;color:var(--w4);margin-top:2px}

/* Models */
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mod{text-align:center;padding:12px;background:var(--sf2);border-radius:8px}
.mod-name{font-size:.65rem;color:var(--w4);font-weight:700;margin-bottom:4px}
.mod-val{font-size:1.1rem;font-weight:900;font-family:var(--fm)}

/* Stats */
.st-r{display:flex;align-items:center;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.03)}
.st-v{flex:1;font-size:.85rem;font-weight:700;font-family:var(--fm)}.st-v.l{text-align:left}.st-v.r{text-align:right}
.st-v.hi{color:var(--teal)}.st-lab{flex:0 0 70px;text-align:center;font-size:.7rem;color:var(--w4);font-weight:700}

/* Form dots */
.fdot{display:inline-block;width:22px;height:22px;border-radius:6px;font-size:.6rem;font-weight:800;line-height:22px;text-align:center}
.fdot.W{background:var(--green-bg);border:1px solid var(--green-br);color:var(--green)}
.fdot.L{background:var(--red-bg);border:1px solid var(--red-br);color:var(--red)}
.fm-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.fm-name{font-size:.78rem;font-weight:700;width:70px}
.fm-pct{font-size:.75rem;font-weight:800;font-family:var(--fm);margin-left:auto}

/* Guide */
.guide-panel{margin:16px 0;padding:16px;background:var(--sf);border:1px solid var(--br);border-radius:var(--r)}
.guide-step{padding:10px 0;border-bottom:1px solid var(--br)}
.guide-step:last-child{border:none}
.guide-step-title{font-size:.78rem;font-weight:800;margin-bottom:4px}
.guide-step-desc{font-size:.72rem;color:var(--w3);line-height:1.5}

.save-btn{width:100%;padding:16px;background:var(--teal);color:#000;font-size:1rem;font-weight:900;border:none;border-radius:var(--r);cursor:pointer;font-family:var(--f);transition:.15s;margin-top:16px}
.save-btn:hover{opacity:.9}.save-btn:disabled{opacity:.5;cursor:default}.save-btn.done{background:var(--green)}

.empty{text-align:center;padding:60px 20px;color:var(--w3)}
.empty .ico{font-size:2.5rem;margin-bottom:12px}.empty p{font-size:.9rem;margin-bottom:16px}
.retry{padding:10px 24px;background:var(--teal);color:#000;border:none;border-radius:var(--rs);font-weight:700;cursor:pointer;font-family:var(--f)}
.spin{width:28px;height:28px;border:3px solid var(--br);border-top-color:var(--teal);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px}
.warn{padding:20px;background:var(--gold-bg);border:1px solid var(--gold-br);border-radius:var(--r);color:var(--gold);text-align:center;font-weight:700;font-size:.9rem}

@media(hover:none){button:active,.mc:active,.lg-card:active{opacity:.7;transition:opacity .1s}}
</style>
</head>
<body>
<header><div class="hdr">
  <div class="logo"><div class="logo-icon">🏀</div><div class="logo-txt">Basket<b>Pro</b><span class="logo-v">v4</span></div></div>
  <div class="pills">
    <button class="pill" onclick="goD(-1,this)">Ieri</button>
    <button class="pill on" onclick="goD(0,this)">Oggi</button>
    <button class="pill" onclick="goD(1,this)">Domani</button>
  </div>
  <div class="sts"><span class="sdot ld" id="sD"></span><span id="sT">…</span> · <span id="rC">0</span>req</div>
</div></header>

<div class="scr on" id="s-leagues"><div class="W">
  <div class="topbar"><h2>🏀 Campionati</h2><span class="cnt" id="lC"></span></div>
  <div id="lL"><div class="empty"><div class="spin"></div></div></div>
</div></div>

<div class="scr" id="s-matches"><div class="W">
  <div class="topbar"><button class="back" onclick="go('leagues')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Campionati</button><span class="cnt" id="mC"></span></div>
  <div class="m-title" id="mT"></div>
  <div class="m-grid" id="mL"></div>
</div></div>

<div class="scr" id="s-analysis"><div class="W">
  <div class="topbar"><button class="back" onclick="go('matches')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Partite</button></div>
  <div id="aB"><div class="empty"><div class="spin"></div></div></div>
</div></div>

<script>

function normCDF(z){const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;const s=z<0?-1:1;z=Math.abs(z)/Math.SQRT2;const t=1/(1+p*z);const y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-z*z);return 0.5*(1+s*y)}

// ═══ ENGINE v4 — Gaussian O/U, refined scoring ═══

const LEAGUE_HA={12:3.5,116:2.5,117:2.8,120:4,194:3.5,119:3,132:4,79:3.5,202:3,160:4.5,83:4,206:3.5};
function getHA(lid){return LEAGUE_HA[lid]||3.2}

function anG(games,tid){
  const fin=games.filter(g=>['FT','AOT'].includes(g.status?.short)&&g.scores?.home?.total!=null).sort((a,b)=>new Date(a.date)-new Date(b.date)||(a.id-b.id));
  if(!fin.length)return null;
  let tP=0,tO=0,w=0,hW=0,hN=0,aW=0,aN=0;const mg=[],tt=[];
  fin.forEach(g=>{const isH=g.teams.home.id===tid,my=isH?g.scores.home.total:g.scores.away.total,op=isH?g.scores.away.total:g.scores.home.total;tP+=my;tO+=op;mg.push(my-op);tt.push(my+op);if(my>op)w++;if(isH){hN++;if(my>op)hW++}else{aN++;if(my>op)aW++}});
  const last6=fin.slice(-6).reverse();
  const f6=last6.map(g=>{const isH=g.teams.home.id===tid,my=isH?g.scores.home.total:g.scores.away.total,op=isH?g.scores.away.total:g.scores.home.total;return my>op?'W':'L'});
  const l10=fin.slice(-10);let r10=0,r10o=0,r10w=0;
  l10.forEach((g,i)=>{const isH=g.teams.home.id===tid;const wt=1+i*0.12;r10+=(isH?g.scores.home.total:g.scores.away.total)*wt;r10o+=(isH?g.scores.away.total:g.scores.home.total)*wt;r10w+=wt});
  let hPts=0,hOpp=0,hCnt=0,aPts=0,aOpp=0,aCnt=0;
  fin.forEach(g=>{const isH=g.teams.home.id===tid,my=isH?g.scores.home.total:g.scores.away.total,op=isH?g.scores.away.total:g.scores.home.total;if(isH){hPts+=my;hOpp+=op;hCnt++}else{aPts+=my;aOpp+=op;aCnt++}});
  const N=fin.length,ppg=tP/N,opg=tO/N,mm=mg.reduce((s,x)=>s+x,0)/N;
  const pace=tt.reduce((s,x)=>s+x,0)/N;
  const ppgArr=fin.map(g=>{const isH=g.teams.home.id===tid;return isH?g.scores.home.total:g.scores.away.total});
  const ppgStd=Math.sqrt(ppgArr.reduce((s,x)=>s+(x-ppg)*(x-ppg),0)/N);
  // v4: Varianza dei totali di squadra per O/U
  const totArr=fin.map(g=>g.scores.home.total+g.scores.away.total);
  const totStd=Math.sqrt(totArr.reduce((s,x)=>s+(x-pace)*(x-pace),0)/N);
  const lastDate=fin.length?new Date(fin[fin.length-1].date):null;
  const prevDate=fin.length>=2?new Date(fin[fin.length-2].date):null;
  let b2b=false;if(lastDate&&prevDate){if((lastDate-prevDate)/(1000*60*60*24)<=1.5)b2b=true}
  let str=0;if(f6.length){const f=f6[0];for(const r of f6){if(r===f)str++;else break}if(f==='L')str=-str}
  const last5=fin.slice(-5),prev5=fin.slice(-10,-5);let trendPts=0,trendOpp=0;
  if(last5.length>=3&&prev5.length>=3){
    const l5p=last5.reduce((s,g)=>{const isH=g.teams.home.id===tid;return s+(isH?g.scores.home.total:g.scores.away.total)},0)/last5.length;
    const p5p=prev5.reduce((s,g)=>{const isH=g.teams.home.id===tid;return s+(isH?g.scores.home.total:g.scores.away.total)},0)/prev5.length;
    trendPts=l5p-p5p;
    const l5o=last5.reduce((s,g)=>{const isH=g.teams.home.id===tid;return s+(isH?g.scores.away.total:g.scores.home.total)},0)/last5.length;
    const p5o=prev5.reduce((s,g)=>{const isH=g.teams.home.id===tid;return s+(isH?g.scores.away.total:g.scores.home.total)},0)/prev5.length;
    trendOpp=l5o-p5o;
  }
  return{ppg,opg,rP:r10w>0?r10/r10w:ppg,rO:r10w>0?r10o/r10w:opg,wp:w/N,hWP:hN>=3?hW/hN:w/N,aWP:aN>=3?aW/aN:w/N,net:ppg-opg,avgT:pace,hPpg:hCnt?hPts/hCnt:ppg,hOpg:hCnt?hOpp/hCnt:opg,aPpg:aCnt?aPts/aCnt:ppg,aOpg:aCnt?aOpp/aCnt:opg,std:Math.sqrt(mg.reduce((s,x)=>s+(x-mm)*(x-mm),0)/N),ppgStd,totStd,form:f6,streak:str,N,w,b2b,lastDate,pace,trendPts,trendOpp}
}

function h2h(t,o){
  const all=Object.values($.g).flat();
  const m=all.filter(g=>['FT','AOT'].includes(g.status?.short)&&((g.teams.home.id===t&&g.teams.away.id===o)||(g.teams.home.id===o&&g.teams.away.id===t)));
  let w=0,totPts=0;
  m.forEach(g=>{const h=g.teams.home.id===t,my=h?g.scores.home.total:g.scores.away.total,op=h?g.scores.away.total:g.scores.home.total;if(my>op)w++;totPts+=(g.scores.home.total+g.scores.away.total)});
  return{w,n:m.length,avgT:m.length?totPts/m.length:0}
}

function bElo(games){
  const elo={},K=24;
  games.filter(g=>['FT','AOT'].includes(g.status?.short)&&g.scores?.home?.total!=null)
    .sort((a,b)=>new Date(a.date)-new Date(b.date)||(a.id-b.id))
    .forEach(g=>{
      const h=g.teams.home.id,a=g.teams.away.id;
      if(!elo[h])elo[h]=1500;if(!elo[a])elo[a]=1500;
      const hs=g.scores.home.total,as=g.scores.away.total;
      const ha=getHA(g.league?.id||0);
      const exp=1/(1+Math.pow(10,-(elo[h]+ha*15-elo[a])/400));
      const res=hs>as?1:hs<as?0:.5;
      const mov=Math.log(Math.abs(hs-as)+1)*2.2/(Math.abs(elo[h]-elo[a])*.001+2.2);
      const adj=K*mov*(res-exp);
      elo[h]+=adj;elo[a]-=adj;
    });
  return elo;
}

function pred(hD,aD,hS,aS,stand,odds,elo,game){
  const hid=game.teams.home.id,aid=game.teams.away.id;
  const lid=game.league?.id||0;
  const hE=elo[hid]||1500,aE=elo[aid]||1500;
  const ha=getHA(lid);

  // === 4 MODELLI ===
  const m1=1/(1+Math.pow(10,-(hE-aE+ha*15)/400))*100;
  const hwp=cl(.15,hD.hWP,.90),awp=cl(.10,aD.aWP,.85);
  const m2=(hwp*(1-awp))/(hwp*(1-awp)+(1-hwp)*awp)*100;
  const hNetAdj=hD.net+(hD.trendPts-hD.trendOpp)*0.3;
  const aNetAdj=aD.net+(aD.trendPts-aD.trendOpp)*0.3;
  const m3=100/(1+Math.pow(10,-(hNetAdj-aNetAdj+ha*0.8)/12));
  const hFW=hD.form.length?hD.form.filter(x=>x==='W').length/hD.form.length:.5;
  const aFW=aD.form.length?aD.form.filter(x=>x==='W').length/aD.form.length:.5;
  let m4=50+(hFW-aFW)*25+cl(-4,(hD.streak-aD.streak)*.9,4);
  if(hD.b2b) m4-=3;
  if(aD.b2b) m4+=3;
  m4=cl(25,m4,75);

  let hP=m1*.35+m2*.22+m3*.28+m4*.15;
  const hh=h2h(hid,aid);
  if(hh.n>=3) hP+=(hh.w/hh.n-.5)*4;
  const flat=Array.isArray(stand)?stand.flat?.(2)??stand:[];
  const hSt=flat.find(s=>s?.team?.id===hid),aSt=flat.find(s=>s?.team?.id===aid);
  if(hSt?.position&&aSt?.position) hP+=cl(-3,(aSt.position-hSt.position)*.15,3);
  hP=Math.round(cl(28,hP,72));
  const aP=100-hP;

  // === SCORE PREDICTION ===
  const gamePace=(hD.pace+aD.pace)/2;
  const paceAdj=gamePace>0?gamePace/200:1;
  const hOff=hD.rP*0.55+hD.ppg*0.45;
  const aOff=aD.rP*0.55+aD.ppg*0.45;
  const hDef=hD.rO*0.55+hD.opg*0.45;
  const aDef=aD.rO*0.55+aD.opg*0.45;
  let fH=Math.round((hOff*0.5+aDef*0.5)*paceAdj+ha/2);
  let fA=Math.round((aOff*0.5+hDef*0.5)*paceAdj-ha/2);
  if(hD.b2b) fH=Math.round(fH*0.97);
  if(aD.b2b) fA=Math.round(fA*0.97);
  fH+=Math.round(cl(-2,hD.trendPts*0.15,2));
  fA+=Math.round(cl(-2,aD.trendPts*0.15,2));
  const pT=fH+fA,sp=fH-fA;

  // === v4: O/U con Gaussian CDF — MOLTO più preciso ===
  // Combina varianza dei totali di entrambe le squadre
  const combinedTotStd=Math.sqrt((hD.totStd||12)*(hD.totStd||12)+(aD.totStd||12)*(aD.totStd||12))/Math.SQRT2;
  // Linea principale: media dei totali storici, arrotondato a .5
  const rawLine=(hD.avgT+aD.avgT)/2;
  const mL=Math.round(rawLine*2)/2; // arrotonda a .5 più vicino (es. 212.5)
  
  // Over% = P(X > line) dove X ~ N(pT, combinedTotStd)
  // Usa la stima del totale predetto come centro della distribuzione
  const effectiveMean=pT*0.6+rawLine*0.4; // blend tra predicted e storico
  const effectiveStd=Math.max(combinedTotStd,8); // floor a 8 punti
  const zOU=(mL-effectiveMean)/effectiveStd;
  const oP=Math.round(cl(10,(1-normCDF(zOU))*100,90)); // P(totale > linea)
  
  // H2H adjustment
  let ouAdj=0;
  if(hh.n>=3&&hh.avgT>0){
    if(hh.avgT>mL+8) ouAdj=4;
    else if(hh.avgT>mL+3) ouAdj=2;
    else if(hh.avgT<mL-8) ouAdj=-4;
    else if(hh.avgT<mL-3) ouAdj=-2;
  }
  const oPFinal=cl(10,oP+ouAdj,90);
  
  // O/U su linee multiple — tutte con Gaussian CDF
  const ouL=[];
  for(let x=-20;x<=20;x+=5){
    const l=mL+x;if(l<80||l>500)continue;
    const z2=(l-effectiveMean)/effectiveStd;
    const overP=Math.round(cl(5,(1-normCDF(z2))*100,95));
    ouL.push({l,o:overP,m:x===0});
  }

  // === MULTIGOL SQUADRA con Gaussian ===
  const hStd=hD.ppgStd||8;const aStd=aD.ppgStd||8;
  const overH=Math.round(cl(18,normCDF((fH-hD.ppg)/Math.max(hStd,4))*100,82));
  const overA=Math.round(cl(18,normCDF((fA-aD.ppg)/Math.max(aStd,4))*100,82));
  const mgH=fH>=hD.ppg?`Over ${Math.round(hD.ppg-2)}.5`:`Under ${Math.round(hD.ppg+2)}.5`;
  const mgA=fA>=aD.ppg?`Over ${Math.round(aD.ppg-2)}.5`:`Under ${Math.round(aD.ppg+2)}.5`;
  const mgHP=fH>=hD.ppg?overH:100-overH;
  const mgAP=fA>=aD.ppg?overA:100-overA;

  // === HANDICAP ===
  const hcL=Math.max(1.5,Math.round(Math.abs(sp)*2)/2);
  const hcT=sp>=0?game.teams.home.name:game.teams.away.name;
  const hcC=cl(35,50+Math.abs(sp)*1.5+(hP>55||aP>55?5:0),75);

  // === CONCORDANZA ===
  const sv=p=>p>55?'H':p<45?'A':'X',sides=[sv(m1),sv(m2),sv(m3),sv(m4)];
  const conc=Math.max(sides.filter(x=>x==='H').length,sides.filter(x=>x==='A').length);
  const spread=Math.max(m1,m2,m3,m4)-Math.min(m1,m2,m3,m4);
  const conf=cl(25,Math.round(80-spread*.4+(conc>=3?12:conc>=2?4:0)-(hD.b2b||aD.b2b?5:0)),82);
  const confL=conf>=65?'Alta':conf>=45?'Media':'Bassa';

  // === VALUE BET ===
  let bkH=null,bkA=null,value=null;
  if(odds?.length){
    odds.forEach(o=>{(o.bookmakers||[]).forEach(b=>{(b.bets||[]).forEach(bt=>{if(bt.name==='Home/Away'||bt.name==='Match Winner')(bt.values||[]).forEach(v=>{if(v.value==='Home'&&!bkH)bkH=parseFloat(v.odd);if(v.value==='Away'&&!bkA)bkA=parseFloat(v.odd)})})})});
    if(bkH&&bkA){
      const totM=1/bkH+1/bkA;const iH=(1/bkH/totM)*100,iA=(1/bkA/totM)*100;
      const eH=hP-iH,eA=aP-iA;
      if(eH>3) value={e:eH,p:hP,bp:iH,o:bkH,t:game.teams.home.name,side:'H'};
      else if(eA>3) value={e:eA,p:aP,bp:iA,o:bkA,t:game.teams.away.name,side:'A'};
    }
  }

  const fav=hP>=50?game.teams.home.name:game.teams.away.name,favP=Math.max(hP,aP);
  const pick=hP>=50?'1':'2';
  const ouPick=oPFinal>52?'OVER':'UNDER';

  const reas=[];
  if(Math.abs(hE-aE)>80)reas.push(`Elo ${Math.round(hE)} vs ${Math.round(aE)}: ${hE>aE?game.teams.home.name:game.teams.away.name} superiore`);
  else reas.push(`Elo equilibrato (${Math.round(hE)} vs ${Math.round(aE)})`);
  if(Math.abs(hD.net-aD.net)>3)reas.push(`Net rating ${fav} +${fm(Math.abs(hD.net-aD.net),1)}`);
  reas.push(`Forma: ${game.teams.home.name} ${(hFW*100).toFixed(0)}%W, ${game.teams.away.name} ${(aFW*100).toFixed(0)}%W`);
  if(hD.b2b)reas.push(`⚠️ ${game.teams.home.name} back-to-back`);
  if(aD.b2b)reas.push(`⚠️ ${game.teams.away.name} back-to-back`);
  if(hD.trendPts>3)reas.push(`📈 ${game.teams.home.name} in crescita (+${fm(hD.trendPts,1)} ppg trend)`);
  if(aD.trendPts>3)reas.push(`📈 ${game.teams.away.name} in crescita (+${fm(aD.trendPts,1)} ppg trend)`);
  if(hh.n>=2)reas.push(`H2H: ${hh.n} scontri, ${game.teams.home.name} ${hh.w}V${hh.avgT>0?' (media '+Math.round(hh.avgT)+' pts)':''}`);

  return{hP,aP,fH,fA,pT,sp,m1:Math.round(m1*10)/10,m2:Math.round(m2*10)/10,m3:Math.round(m3*10)/10,m4:Math.round(m4*10)/10,conc,conf,confL,mL,oP:oPFinal,ouL,ouPick,hD,aD,hE,aE,fav,favP,bkH,bkA,value,pick,hcT,hcL,hcC,reas,hh,hFW,aFW,mgH,mgA,mgHP,mgAP,effectiveMean,effectiveStd}
}

// ═══ v4: ODDS LAB ═══
function buildOddsLab(odds,R){
  if(!odds?.length)return null;
  const bks=[];const sharpNames=['pinnacle','bet365','unibet','betfair','bwin'];
  odds.forEach(o=>{(o.bookmakers||[]).forEach(b=>{
    const mkt=(b.bets||[]).find(bt=>bt.name==='Home/Away'||bt.name==='Match Winner');
    if(!mkt?.values?.length)return;
    const hOdd=parseFloat(mkt.values.find(v=>v.value==='Home')?.odd||0);
    const aOdd=parseFloat(mkt.values.find(v=>v.value==='Away')?.odd||0);
    if(hOdd<=1||aOdd<=1)return;
    const tot=1/hOdd+1/aOdd;const isSharp=sharpNames.some(s=>(b.name||'').toLowerCase().includes(s));
    bks.push({name:b.name,isSharp,hOdd,aOdd,hProb:(1/hOdd/tot)*100,aProb:(1/aOdd/tot)*100,margin:((tot-1)*100).toFixed(1)});
  })});
  if(!bks.length)return null;
  const sharp=bks.find(b=>b.isSharp)||bks.reduce((a,b)=>parseFloat(a.margin)<parseFloat(b.margin)?a:b);
  let cH=0,cA=0,tw=0;
  bks.forEach(b=>{const w=b.isSharp?2:1;cH+=b.hProb*w;cA+=b.aProb*w;tw+=w});
  const consensus={home:cH/tw,away:cA/tw};
  // Steam moves
  const steams=[];
  const soft=bks.filter(b=>!b.isSharp);
  if(soft.length>=2&&sharp){
    const avgSH=soft.reduce((s,b)=>s+b.hProb,0)/soft.length;
    const avgSA=soft.reduce((s,b)=>s+b.aProb,0)/soft.length;
    const dH=sharp.hProb-avgSH,dA=sharp.aProb-avgSA;
    if(dH>3)steams.push({dir:'home',d:dH.toFixed(1),msg:'Smart money sulla casa — sharp più bassi dei soft'});
    if(dA>3)steams.push({dir:'away',d:dA.toFixed(1),msg:'Smart money sull\'ospite — sharp più bassi dei soft'});
  }
  return{bks,sharp,consensus,steams,bestH:Math.max(...bks.map(b=>b.hOdd)),bestA:Math.max(...bks.map(b=>b.aOdd)),bestHBk:bks.reduce((a,b)=>b.hOdd>a.hOdd?b:a).name,bestABk:bks.reduce((a,b)=>b.aOdd>a.aOdd?b:a).name}
}

// ═══ v4: REGRESSION SCORE ═══
function calcRegression(R,oLab,game){
  const factors=[];let totS=0,totW=0;
  // 1. Elo gap (25%)
  {const w=25;const gap=Math.abs(R.hE-R.aE);const s=cl(0,gap/200*100,100);
  factors.push({n:'⚡ Elo Gap',s:Math.round(s),w,c:s>65?'var(--green)':s>40?'var(--gold)':'var(--red)'});totS+=s*w;totW+=w}
  // 2. Net Rating diff (20%)
  {const w=20;const diff=Math.abs(R.hD.net-R.aD.net);const s=cl(0,diff/12*100,100);
  factors.push({n:'📊 Net Rating',s:Math.round(s),w,c:s>65?'var(--green)':s>40?'var(--gold)':'var(--red)'});totS+=s*w;totW+=w}
  // 3. Conferma Quote (20%)
  {const w=20;let s=50;if(oLab){const bkFav=R.hP>=50?oLab.consensus.home:oLab.consensus.away;s=cl(0,(bkFav-25)/(45)*100,100)}else if(R.bkH){const totM=1/R.bkH+1/R.bkA;const bkFav=R.hP>=50?(1/R.bkH/totM)*100:(1/R.bkA/totM)*100;s=cl(0,(bkFav-25)/45*100,100)}
  factors.push({n:'💰 Conferma Quote',s:Math.round(s),w,c:s>65?'var(--green)':s>40?'var(--gold)':'var(--red)'});totS+=s*w;totW+=w}
  // 4. Forma recente (15%)
  {const w=15;const favFW=R.hP>=50?R.hFW:R.aFW;const s=cl(0,((favFW-0.3)/0.5)*100,100);
  factors.push({n:'🔥 Forma',s:Math.round(s),w,c:s>65?'var(--green)':s>40?'var(--gold)':'var(--red)'});totS+=s*w;totW+=w}
  // 5. Difesa (10%)
  {const w=10;const favDef=R.hP>=50?R.hD.opg:R.aD.opg;const avg=(R.hD.avgT+R.aD.avgT)/4;const s=cl(0,(1-(favDef-avg*0.7)/(avg*0.6))*100,100);
  factors.push({n:'🛡️ Difesa',s:Math.round(s),w,c:s>65?'var(--green)':s>40?'var(--gold)':'var(--red)'});totS+=s*w;totW+=w}
  // 6. Smart Money (10%)
  {const w=10;let s=50;if(oLab&&oLab.steams.length){const favDir=R.hP>=50?'home':'away';const fav=oLab.steams.find(x=>x.dir===favDir);if(fav)s=80+parseFloat(fav.d);const und=oLab.steams.find(x=>x.dir!==favDir);if(und)s=20}s=cl(0,s,100);
  factors.push({n:'🔥 Smart Money',s:Math.round(s),w,c:s>65?'var(--green)':s>40?'var(--gold)':'var(--red)'});totS+=s*w;totW+=w}
  const final=totW>0?totS/totW:50;
  let grade,gc;
  if(final>=80){grade='A+';gc='var(--green)'}else if(final>=70){grade='A';gc='var(--teal)'}else if(final>=60){grade='B+';gc='var(--blue)'}else if(final>=50){grade='B';gc='var(--gold)'}else if(final>=40){grade='C';gc='var(--red)'}else{grade='D';gc='var(--red)'}
  const rec=final>=70?'FORTE':final>=55?'GIOCABILE':'EVITARE';
  return{score:Math.round(final),grade,gc,rec,factors,favName:R.fav}
}

// ═══ v4: CONSENSUS ENGINE ═══
function buildConsensus(R,oLab,reg,game){
  const src=[];const votes={};
  function addV(name,pick,prob,w,icon){
    if(!pick)return;
    const np=pick==='1'||pick==='H'?'1':'2';
    src.push({name,pick:np,prob:parseFloat(prob)||0,w,icon});
    if(!votes[np])votes[np]={cnt:0,tw:0,mp:0,src:[]};
    votes[np].cnt++;votes[np].tw+=w;votes[np].mp=Math.max(votes[np].mp,parseFloat(prob)||0);votes[np].src.push(name);
  }
  // 1. Blend 4 modelli (peso 3)
  addV('Modello AI',R.pick,R.favP,3,'🎯');
  // 2. Bookmaker (peso 3)
  if(oLab){const bp=oLab.consensus.home>oLab.consensus.away?'1':'2';const bpP=Math.max(oLab.consensus.home,oLab.consensus.away);addV('Bookmakers',bp,bpP,3,'💰')}
  else if(R.bkH&&R.bkA){const totM=1/R.bkH+1/R.bkA;const iH=(1/R.bkH/totM)*100;addV('Bookmaker',iH>50?'1':'2',Math.max(iH,100-iH),2.5,'💰')}
  // 3. Regression (peso 2)
  if(reg&&reg.score>=55)addV('Regressione',R.hP>=50?'1':'2',reg.score,2,'📊');
  // 4. Steam (peso 1.5)
  if(oLab?.steams.length){const bull=oLab.steams[0];if(bull)addV('Smart Money',bull.dir==='home'?'1':'2',65,1.5,'🔥')}
  
  const sorted=Object.entries(votes).map(([p,d])=>({pick:p,...d,score:d.tw*(d.mp/100)*d.cnt})).sort((a,b)=>b.score-a.score);
  if(!sorted.length)return{pick:R.pick,prob:R.favP,conf:'BASSA',cc:'var(--red)',agr:0,agrN:0,totN:0,src:[]};
  const win=sorted[0];const totN=src.length;const agrN=src.filter(s=>s.pick===win.pick).length;
  const agr=totN>0?(agrN/totN*100):0;
  let conf='MEDIA',cc='var(--gold)';
  if(agr>=80&&win.mp>=58){conf='MASSIMA';cc='var(--green)'}
  else if(agr>=60&&win.mp>=52){conf='ALTA';cc='var(--teal)'}
  else if(agr<40){conf='BASSA';cc='var(--red)'}
  // Prob pesata
  const agSrc=src.filter(s=>s.pick===win.pick);let wp=0,sw=0;agSrc.forEach(s=>{wp+=s.prob*s.w;sw+=s.w});
  const fProb=sw>0?wp/sw:win.mp;
  return{pick:win.pick,prob:fProb.toFixed(1),conf,cc,agr:agr.toFixed(0),agrN,totN,src:src.map(s=>({...s,ok:s.pick===win.pick}))}
}

// ═══ v4: VALUE BETS + KELLY ═══
function calcValueKelly(R,oLab){
  if(!oLab&&!R.bkH)return null;
  const results=[];
  const bestH=oLab?oLab.bestH:R.bkH;const bestA=oLab?oLab.bestA:R.bkA;
  const bestHBk=oLab?oLab.bestHBk:'';const bestABk=oLab?oLab.bestABk:'';
  if(bestH>1){const e=(R.hP/100)*bestH-1;const k=Math.max(0,(R.hP/100*bestH-(1-R.hP/100))/(bestH-1));
    results.push({pick:'1',prob:R.hP,imp:((1/bestH)*100).toFixed(1),odds:bestH.toFixed(2),bk:bestHBk,edge:(e*100).toFixed(1),isVal:e>0,kelly:(Math.min(5,k*25)*100/100).toFixed(1),rating:e>.1?'HOT':e>.05?'GOOD':e>0?'MILD':'NO'})}
  if(bestA>1){const e=(R.aP/100)*bestA-1;const k=Math.max(0,(R.aP/100*bestA-(1-R.aP/100))/(bestA-1));
    results.push({pick:'2',prob:R.aP,imp:((1/bestA)*100).toFixed(1),odds:bestA.toFixed(2),bk:bestABk,edge:(e*100).toFixed(1),isVal:e>0,kelly:(Math.min(5,k*25)*100/100).toFixed(1),rating:e>.1?'HOT':e>.05?'GOOD':e>0?'MILD':'NO'})}
  results.sort((a,b)=>parseFloat(b.edge)-parseFloat(a.edge));
  return{bets:results,topVal:results.filter(r=>r.isVal)}
}

        <div class="bc-reason">${sn(R.fav)} favorito. ${wReason}</div>
      </div>
      <div class="bet-card${Math.abs(R.oP-50)>5?' best':''}">
        ${Math.abs(R.oP-50)>5?'<span class="bc-rec">CONSIGLIATO</span>':''}
        <div class="bc-hd"><div class="bc-icon ou">📈</div><span class="bc-label">Over/Under ${R.mL}</span></div>
        <div class="bc-pick" style="color:${R.oP>52?'var(--green)':'var(--blue)'}">${R.ouPick}</div>
        <div class="bc-pct" style="color:${R.oP>52?'var(--green)':'var(--blue)'}">O ${R.oP}% · U ${100-R.oP}%</div>
        <div class="bc-reason">Totale previsto ${R.pT}. Media storica ${R.mL}. σ=${R.effectiveStd.toFixed(1)}</div>
      </div>
      <div class="bet-card">
        <div class="bc-hd"><div class="bc-icon mg">🎯</div><span class="bc-label">Punti squadra</span></div>
        <div style="margin-bottom:8px"><div style="font-size:.9rem;font-weight:800;color:var(--blue)">${sn(hn)}: ${R.mgH}</div><div style="font-size:.85rem;color:var(--w3)">${R.mgHP}%</div></div>
        <div><div style="font-size:.9rem;font-weight:800;color:var(--blue)">${sn(an)}: ${R.mgA}</div><div style="font-size:.85rem;color:var(--w3)">${R.mgAP}%</div></div>
      </div>
      <div class="bet-card${R.hcC>=58?' best':''}">
        ${R.hcC>=58?'<span class="bc-rec">CONSIGLIATO</span>':''}
        <div class="bc-hd"><div class="bc-icon hc">⚖️</div><span class="bc-label">Handicap</span></div>
        <div class="bc-pick" style="color:var(--violet)">${sn(R.hcT)} -${R.hcL}</div>
        <div class="bc-pct" style="color:var(--violet)">${R.hcC}%</div>
        <div class="bc-reason">Spread previsto: ${R.sp>0?'+':''}${R.sp} punti</div>
      </div>
    </div>

    <div class="pred"><div class="pred-box"><div class="pred-lbl">🏀 Risultato Previsto</div><div class="pred-val">${R.fH} <span style="color:var(--w4)">–</span> ${R.fA}</div><div class="pred-sub">Totale: ${R.pT} · Spread: ${R.sp>0?'+':''}${R.sp}</div></div></div>

    ${valHtml}

    <div class="ai"><div class="ai-hd"><div class="ai-icon">🤖</div><span class="ai-name">Analisi AI</span><span class="ai-badge">Groq LLM</span></div><div class="ai-txt" id="${aiId}"><em style="color:var(--w4)">Analisi in corso…</em></div></div>

    ${olabHtml}

    <div class="sec"><button class="sec-btn" onclick="tS(this)">📈 Over/Under dettaglio <span class="sec-arr">▼</span></button><div class="sec-body"><div class="sec-inner"><div style="font-size:.68rem;color:var(--w4);margin-bottom:8px">Linea: ${R.mL} · Totale previsto: ${R.pT} · μ=${R.effectiveMean.toFixed(1)} · σ=${R.effectiveStd.toFixed(1)} · Gaussian CDF</div><div class="ou-grid">${R.ouL.map(x=>`<div class="ou-item${x.m?' main':''}"><div class="ou-val" style="color:${x.o>55?'var(--green)':x.o<45?'var(--blue)':'var(--w3)'}">O/U ${x.l}</div><div class="ou-lbl">Over ${x.o}% · Under ${100-x.o}%</div></div>`).join('')}</div></div></div></div>

    <div class="sec"><button class="sec-btn" onclick="tS(this)">🔬 4 Modelli indipendenti <span class="sec-arr">▼</span></button><div class="sec-body"><div class="sec-inner"><div class="mod-grid">
      <div class="mod"><div class="mod-name">Elo 35%</div><div class="mod-val" style="color:${R.m1>55?'var(--teal)':R.m1<45?'var(--blue)':'var(--w3)'}">${fm(R.m1,1)}%</div></div>
      <div class="mod"><div class="mod-name">Log5 22%</div><div class="mod-val" style="color:${R.m2>55?'var(--teal)':R.m2<45?'var(--blue)':'var(--w3)'}">${fm(R.m2,1)}%</div></div>
      <div class="mod"><div class="mod-name">Efficiency 28%</div><div class="mod-val" style="color:${R.m3>55?'var(--teal)':R.m3<45?'var(--blue)':'var(--w3)'}">${fm(R.m3,1)}%</div></div>
      <div class="mod"><div class="mod-name">Forma 15%</div><div class="mod-val" style="color:${R.m4>55?'var(--teal)':R.m4<45?'var(--blue)':'var(--w3)'}">${fm(R.m4,1)}%</div></div>
    </div><div style="text-align:center;font-size:.75rem;color:var(--w4);margin-top:8px">Concordanza: ${R.conc}/4 · Confidenza: ${R.conf}% (${R.confL})</div></div></div></div>

    <div class="sec"><button class="sec-btn" onclick="tS(this)">📊 Statistiche <span class="sec-arr">▼</span></button><div class="sec-body"><div class="sec-inner"><div style="display:flex;justify-content:space-between;font-size:.7rem;font-weight:800;padding:0 8px;margin-bottom:4px"><span style="color:var(--teal)">${sn(hn)}</span><span style="color:var(--blue)">${sn(an)}</span></div>${stH}</div></div></div>

    <div class="sec"><button class="sec-btn" onclick="tS(this)">🔥 Forma recente <span class="sec-arr">▼</span></button><div class="sec-body"><div class="sec-inner">
      <div class="fm-row"><span class="fm-name" style="color:var(--teal)">${sn(hn)}</span><div style="display:flex;gap:3px">${fD(R.hD.form)}</div><span class="fm-pct">${(R.hFW*100).toFixed(0)}%</span></div>
      <div class="fm-row"><span class="fm-name" style="color:var(--blue)">${sn(an)}</span><div style="display:flex;gap:3px">${fD(R.aD.form)}</div><span class="fm-pct">${(R.aFW*100).toFixed(0)}%</span></div>
      ${R.hh.n?`<div style="font-size:.8rem;color:var(--w3);margin-top:6px">H2H: ${R.hh.n} scontri · ${sn(hn)} ${R.hh.w}V</div>`:''}</div></div></div>

    <div class="sec"><button class="sec-btn" onclick="tS(this)">📖 Guida — Come usare BasketPro <span class="sec-arr">▼</span></button><div class="sec-body"><div class="sec-inner">
      <div class="guide-panel" style="padding:0;border:none;background:transparent">
        <div class="guide-step"><div class="guide-step-title" style="color:var(--teal)">1 · 🏆 CONSENSUS ENGINE</div><div class="guide-step-desc">Fonde Modello AI, Bookmakers, Regressione e Smart Money. Se dice <b>MASSIMA</b> con accordo ≥80% → pick molto solido. Se <b>BASSA</b> → evita.</div></div>
        <div class="guide-step"><div class="guide-step-title" style="color:var(--violet)">2 · 📊 REGRESSION SCORE</div><div class="guide-step-desc">Punteggio 0-100 con grado A+→D. Elo, Net Rating, Quote, Forma, Difesa, Smart Money. <b>A/A+</b> = forte. <b>C/D</b> = evita in multipla.</div></div>
        <div class="guide-step"><div class="guide-step-title" style="color:var(--green)">3 · 📈 OVER/UNDER</div><div class="guide-step-desc">Ora usa <b>Gaussian CDF</b> reale con deviazione standard. Linea a .5. Molto più preciso. Guarda σ: bassa = prevedibile, alta = volatile.</div></div>
        <div class="guide-step"><div class="guide-step-title" style="color:var(--gold)">4 · 💰 VALUE BET + KELLY</div><div class="guide-step-desc">Se l'edge è positivo (verde) → value bet. Il <b>Kelly%</b> indica quanto del bankroll puntare. Guarda quale bookmaker offre la quota migliore.</div></div>
        <div class="guide-step"><div class="guide-step-title" style="color:var(--w2)">🏅 REGOLA D'ORO</div><div class="guide-step-desc" style="background:var(--green-bg);border:1px solid var(--green-br);padding:10px;border-radius:8px;margin-top:6px">Gioca solo quando: <b>Consensus = MASSIMA o ALTA</b> + <b>Regression = A o A+</b>. Per multiple, solo partite che soddisfano entrambe.</div></div>
      </div>
    </div></div></div>

    <button class="save-btn" id="sBtn" onclick="saveP(${g.id})">⭐ Salva pronostico</button>`;
}

function tS(b){const body=b.nextElementSibling;body.classList.toggle('open');const arr=b.querySelector('.sec-arr');if(arr)arr.classList.toggle('open')}

// ═══ SAVE ═══
async function saveP(gid){
  const btn=document.getElementById('sBtn');btn.disabled=true;btn.textContent='Salvataggio…';
  const g=ALL.find(x=>x.id===gid);if(!g){btn.textContent='❌';return}
  const lid=g.league.id,szn=g.league?.season||g.season||'2024-2025',hid=g.teams.home.id,aid=g.teams.away.id;
  const hG=$.g[`${lid}_${szn}_${hid}`]||[],aG=$.g[`${lid}_${szn}_${aid}`]||[];
  const hD=anG(hG,hid),aD=anG(aG,aid);if(!hD||!aD){btn.textContent='❌';return}
  const R=pred(hD,aD,$.s[`${lid}_${szn}_${hid}`],$.s[`${lid}_${szn}_${aid}`],$.st[`${lid}_${szn}`]||[],$.o[gid]||[],bElo([...new Map([...hG,...aG].map(x=>[x.id,x])).values()]),g);
  const data={gameId:gid,match:`${g.teams.home.name} vs ${g.teams.away.name}`,league:g.league.name,date:g.date,pick:R.pick,fav:R.fav,hP:R.hP,aP:R.aP,score:`${R.fH}-${R.fA}`,hcap:`${R.hcT} -${R.hcL}`,ou:`${R.ouPick} ${R.mL}`,conf:R.conf,ts:new Date().toISOString()};
  try{
    const r=await fetch(FB+'/basketpro_picks.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!r.ok)throw Error(r.status);
    btn.textContent='✅ Salvato!';btn.classList.add('done');
  }catch(e){btn.textContent='❌ '+e.message;setTimeout(()=>{btn.disabled=false;btn.textContent='⭐ Salva pronostico';btn.classList.remove('done')},3000)}
}
function goD(o,e){off=o;document.querySelectorAll('.pill').forEach(b=>b.classList.remove('on'));e.classList.add('on');go('leagues');load()}
document.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
